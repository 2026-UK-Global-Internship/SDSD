name: sdsd
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
    sdk: ^3.11.1

dependencies:
    flutter:
        sdk: flutter
    flutter_map: ^8.3.1
    latlong2: ^0.10.1
    firebase_auth:
    cloud_firestore:
    firebase_storage:
    cupertino_icons: ^1.0.8
    webview_flutter: 4.10.0
    google_maps_flutter: ^2.18.0 # 구글 지도 위젯 (핫스팟 핀 표시용)
    geolocator: ^14.0.3 # GPS 현재 위치 가져오기
    camera: ^0.12.0+2 # 인앱 카메라 (청소 인증 - 갤러리 업로드 방지)
    image_picker: ^1.2.3 # 사진 촬영/선택 (쓰레기 신고용)
    http: ^1.6.0 # 백엔드 REST API 통신
    provider: ^6.1.5+1 # 상태 관리
    shared_preferences: ^2.5.5 # 세션/로그인 토큰 저장
    firebase_core: ^4.12.1
    google_sign_in: ^6.2.0
    flutter_colorpicker: ^1.1.0
    supabase_flutter: ^2.16.0
    geocoding: ^4.0.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
    # The following line ensures that the Material Icons font is
    # included with your application, so that you can use the icons in
    # the material Icons class.
    uses-material-design: true
    assets:
        - assets/images/
        - assets/images/icons/
    fonts:
        - family: Inter
          fonts:
              - asset: assets/fonts/Inter_18pt-Regular.ttf
                weight: 400
              - asset: assets/fonts/Inter_18pt-Medium.ttf
                weight: 500
              - asset: assets/fonts/Inter_18pt-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/Inter_18pt-Bold.ttf
                weight: 700
              - asset: assets/fonts/Inter_18pt-Black.ttf
                weight: 900
              - asset: assets/fonts/Inter_18pt-BlackItalic.ttf
                weight: 900
                style: italic
